<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analisador de Números</title>
</head>

<body>

    <header>
        <h1>Analisador de Números</h1>
    </header>
    
    <section>
        <div id="painel-principal">
            <div class="linha-entrada">
                <label for="input-numero">Digite um número (0 a 100):</label>
                <input type="number" id="input-numero" min="0" max="100">
                <input type="button" value="Adicionar" id="botao-inserir" onclick="inserirNumero()">
            </div>

            <select name="seletor-dados" id="seletor-dados" size="8">
            </select>

            <div class="grupo-botoes">
                <input type="button" value="Calcular" id="botao-processar" onclick="processarResultados()">  
                <input type="button" value="Limpar" id="botao-limpar" onclick="limparConsulta()">
            </div>
        </div>

        <div id="painel-resultado">
        </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
