<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>

    <style>

        body {
            background-color: #EBE2D9;
        }

        h1, h4 {
            color: #0F482F;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input::placeholder{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;

        }

        .calc-imc {
            margin-top: 80px;
            text-align: center;
        }

        .campo {
            width: 250px;
            height: 20px;
            margin: 15px;
        }

        .enviar {
            margin-top: 15px;
            width: 100px;
            height: 40px;
            border-radius: 6px;
            background-color: #0F482F;
            color: #EBE2D9;
        }

        .box-display {
            display: flex;
            justify-content: center;
        }
        .box {
            padding: 20px;
            background-color: gray;
            width: 80px;
            height: 80px;
        }
    </style>

</head>
<body>

    <div class="calc-imc">

        <h1>Calculadora de IMC</h1>
        <input class="campo" id="peso" type="number" step="0.1" placeholder="Peso (ex: 70)">
        <input class="campo" id="altura" type="number" step="0.01" placeholder="Altura em metros (ex: 1.75)"><br>
        <input class="enviar" id="total" type="button" onclick="calcularIMC()" value="Calcular">
        <h4 id="resposta"></h4>

    </div>

    <script>

        function calcularIMC() {

            var pesoInput = document.getElementById('peso');
            var alturaInput = document.getElementById('altura');
            var resposta = document.getElementById('resposta');

            var peso = Number(pesoInput.value);
            var altura = Number(alturaInput.value);
        
            if (peso <= 0 || altura <= 0) {
                resposta.innerText = "Por favor, preencha o peso e a altura com valores válidos.";
                resposta.style.color = "#333333";
                return;
            }

            if (altura > 3) {
                altura = altura / 100;
            }

            var imc = peso / (altura * altura);

            var classificacao = "";
            var cor = "";

            if (imc < 18.5) {

                // Abaixo do peso
                classificacao = "Abaixo do peso";
                cor = "#3498db";

            } else if (imc < 25) {

                // Normal
                classificacao = "Peso normal";
                cor = "#2ecc71";

            } else if (imc < 30) {

                // Sobrepeso
                classificacao = "Sobrepeso";
                cor = "#f1c40f";

            } else if (imc < 35) {

                // Obesidade Grau 1
                classificacao = "Obesidade Grau 1";
                cor = "#e67e22";

            } else if (imc < 40) {

                // Obesidade Grau 2
                classificacao = "Obesidade Grau 2";
                cor = "#d35400";

            } else {

                // Obesidade Grau 3
                classificacao = "Obesidade Grau 3";
                cor = "#c0392b";

            }

            resposta.innerText = `IMC: ${imc.toFixed(2)} (${classificacao})`;
            resposta.style.color = cor;

        }

    </script>
        
</body>
</html>
