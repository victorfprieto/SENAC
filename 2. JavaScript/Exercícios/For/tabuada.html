<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>

    <script>

        let numero = Number(prompt("Digite um número entre 1 - 9"));

        for (let i = 1; i <= 10; i++) {
            console.log(numero +" x "+ i +" = "+ (numero * i));
        }
        console.log("Fim.");

    </script>
</head>
