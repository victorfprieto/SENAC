<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de MouseEnter e MouseOut</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            gap: 30px;
        }

        .legenda {
            background-color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .legenda h2 {
            font-size: 16px;
            color: #333333;
            margin: 0 0 10px 0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .legenda ul {
            margin: 0;
            padding-left: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legenda li {
            font-size: 14px;
            color: #555555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legenda li::before {
            content: "";
            width: 6px;
            height: 6px;
            background-color: #666666;
            border-radius: 50%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            gap: 15px;
        }

        .caixa {
            background: #666666;
            width: 100px;
            height: 100px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .botao {
            width: 180px;
            height: 40px;
            background-color: #FFFFFF;
            color: #666666;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .botao:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="legenda">
        <h2>Legenda:</h2>
        <ul>
            <li><strong>MouseEnter:</strong> Caixa cinza > Círculo azul;</li>
            <li><strong>MouseOut:</strong> Círculo azul > Círculo roxo;</li>
            <li><strong>Botão:</strong> Reinicia para o estado normal.</li>
        </ul>
    </div>

    <div class="grid-container">
        <div class="caixa">1</div>
        <div class="caixa">2</div>
        <div class="caixa">3</div>
        <div class="caixa">4</div>
        <div class="caixa">5</div>
        <div class="caixa">6</div>
        <div class="caixa">7</div>
        <div class="caixa">8</div>
        <div class="caixa">9</div>
        <div class="caixa">10</div>
    </div>

    <button id="btn-reset" class="botao">Resetar caixas</button>

    <script>
        var caixas = document.querySelectorAll('.caixa');
        var btnReset = document.getElementById('btn-reset');

        caixas.forEach(caixa => {

            caixa.addEventListener('mouseenter', () => {
                caixa.style.backgroundColor = '#6666ff';
                caixa.style.borderRadius = '50%';
            });

            caixa.addEventListener('mouseleave', () => {
                caixa.style.backgroundColor = '#6600cc';
                caixa.style.borderRadius = '50%'; 
            });

        });

        btnReset.addEventListener('click', () => {
            caixas.forEach(caixa => {
                caixa.style.backgroundColor = '';
                caixa.style.borderRadius = '0px';
            });
        });
    </script>

</body>
</html>
