<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Estrutura Condicional</title>

    <script>

        /* Exercício 01:*/
        let nota1 = Number.parseFloat(prompt("Digite a primeira nota"));
        let nota2 = Number.parseFloat(prompt("Digite a segunda nota"));

        let soma = nota1 + nota2;
        if (soma < 60){
            alert('Nota Final '+ soma +'.\n\nReprovado!');
        } else {
            alert('Nota Final '+ soma +'. Aprovado!');
        }
        

    </script>

</head>
