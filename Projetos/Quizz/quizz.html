<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <title>Qual é o seu pick? WoW Forever</title>
    <style>
        :root {
            --accent: #d9b25a;
            --gold: #d9b25a;
            --gold-d: #8a6a28;
            --bg: #080a10;
            --panel: #11141d;
            --panel2: #171b27;
            --line: #2a2f42;
            --ink: #efe9da;
            --mute: #9a9fb5
        }

        * {
            box-sizing: border-box
        }

        html {
            background: var(--bg)
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 28px 16px 56px;
            background: radial-gradient(900px 480px at 50% -80px, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), radial-gradient(700px 400px at 100% 100%, #1b1030 0%, transparent 70%), var(--bg);
            transition: background .6s
        }

        h1,
        h2,
        h3,
        .cinz {
            font-family: "Cinzel", "Trajan Pro", Georgia, serif;
            font-weight: 700;
            margin: 0;
            letter-spacing: .02em
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto
        }

        header {
            text-align: center;
            margin: 8px 0 28px
        }

        .kicker {
            display: inline-block;
            font-size: 13px;
            color: var(--gold);
            border: 1px solid var(--gold-d);
            border-radius: 20px;
            padding: 2px 14px;
            margin-bottom: 12px;
            background: #0d0f16
        }

        h1 {
            font-size: clamp(28px, 6vw, 46px);
            line-height: 1.1;
            background: linear-gradient(180deg, #fff2c4, #d9b25a 55%, #8a6a28);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none
        }

        header p {
            color: var(--mute);
            margin: 10px auto 0;
            max-width: 58ch
        }

        .card {
            background: linear-gradient(180deg, var(--panel2), var(--panel));
            border: 1px solid var(--line);
            border-top: 2px solid var(--accent);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .45), 0 0 0 1px #000 inset;
            transition: border-color .5s
        }

        .xp {
            position: relative;
            height: 14px;
            background: #06070b;
            border: 1px solid var(--gold-d);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px
        }

        .xp i {
            display: block;
            height: 100%;
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 60%, #000));
            transition: width .4s
        }

        .xp::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0, 0, 0, .55) calc(10% - 1px) 10%)
        }

        .step {
            color: var(--mute);
            font-size: 14px;
            margin-bottom: 16px
        }

        h2 {
            font-size: 22px;
            margin-bottom: 18px;
            line-height: 1.3
        }

        .opt {
            position: relative;
            display: block;
            width: 100%;
            text-align: left;
            background: #0c0e15;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px 16px 14px 20px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            overflow: hidden;
            transition: border-color .15s, background .15s, transform .15s
        }

        .opt::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--c, var(--gold));
            opacity: .35;
            transition: opacity .15s
        }

        .opt:hover {
            border-color: var(--c, var(--gold));
            background: #131723;
            transform: translateX(3px)
        }

        .opt:hover::before {
            opacity: 1
        }

        .opt:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px
        }

        .opt small {
            display: block;
            color: var(--mute);
            margin-top: 3px
        }

        .opt .ic {
            display: inline-block;
            width: 34px;
            font-size: 20px
        }

        .opt b {
            color: var(--c, var(--gold))
        }

        .btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--mute);
            border-radius: 8px;
            padding: 9px 16px;
            font: inherit;
            cursor: pointer;
            transition: all .15s
        }

        .btn:hover {
            color: var(--ink);
            border-color: var(--mute)
        }

        .btn.main {
            background: linear-gradient(180deg, #f0cd7a, #c19433);
            border-color: #f0cd7a;
            color: #1b1203;
            font-weight: 700
        }

        .btn.main:hover {
            filter: brightness(1.08);
            color: #1b1203
        }

        .tie {
            border-left: 3px solid var(--gold);
            padding: 2px 0 2px 12px;
            color: var(--mute);
            margin: 0 0 18px
        }

        .item {
            background: #06080d;
            border: 1px solid var(--c);
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 28px color-mix(in srgb, var(--c) 28%, transparent)
        }

        .item .rar {
            font-size: 13px;
            color: var(--mute)
        }

        .item h2 {
            font-size: clamp(26px, 5vw, 34px);
            color: var(--c);
            margin: 2px 0 0;
            text-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent)
        }

        .item .cl {
            color: var(--c);
            opacity: .85;
            margin-bottom: 10px
        }

        .item .pc {
            color: var(--gold);
            font-weight: 600
        }

        .mt {
            color: var(--gold);
            font-size: 17px;
            margin: 0 0 4px
        }

        .why {
            margin: 0 0 22px;
            padding: 0;
            list-style: none
        }

        .why li {
            position: relative;
            padding: 10px 0 10px 24px;
            border-bottom: 1px solid var(--line)
        }

        .why li:last-child {
            border: 0
        }

        .why li::before {
            content: "◆";
            position: absolute;
            left: 0;
            top: 12px;
            font-size: 12px;
            color: var(--c)
        }

        .why small {
            display: block;
            color: var(--mute);
            font-size: 13px;
            margin-bottom: 2px
        }

        .res {
            margin: 0 0 20px
        }

        .res dt {
            color: var(--gold);
            font-size: 14px;
            margin-top: 12px
        }

        .res dd {
            margin: 2px 0 0
        }

        .top3 {
            padding: 0;
            margin: 0;
            list-style: none
        }

        .top3 li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .top3 li:last-child {
            border: 0
        }

        .top3 span::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--c);
            margin-right: 10px;
            box-shadow: 0 0 8px var(--c)
        }

        .note {
            color: var(--mute);
            font-size: 13px;
            margin-top: 18px
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            flex-wrap: wrap
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <span class="kicker">World of Warcraft Forever</span>
            <h1>Descubra o seu pick</h1>
            <p>Escolha sua função e responda perguntas feitas para ela. O resultado só aparece no final, com os motivos
                da recomendação, e nunca termina empatado no topo.</p>
        </header>
        <main class="card" id="main" aria-live="polite"></main>
    </div>

    <script>
        const g = (l, n = 2) => Object.fromEntries(l.split(' ').map(k => [k, n]));
        // principal 3 pontos, secundária 1 ponto
        const P = (m, s) => ({ w: { [m]: 3, [s]: 1 } });

        // nome, perfil, playstyle, role, forte em
        const S = {
            wprot: ['Warrior Protection', 'metódico, líder', 'muralha com threat sólido e mitigação', 'T', 'PvE'],
            bear: ['Druid Feral (Bear)', 'ágil, resistente', 'HP alto, esquiva e flexibilidade', 'T', 'PvE'],
            pprot: ['Paladin Protection', 'protetor, de suporte', 'tank de AoE com selos e auras', 'T', 'PvE'],
            pholy: ['Paladin Holy', 'direto, pragmático', 'cura potente, simples e resistente', 'H', 'PvE/PvP'],
            dresto: ['Druid Restoration', 'antecipador, móvel', 'HoTs e mobilidade', 'H', 'PvE/PvP'],
            sresto: ['Shaman Restoration', 'posicional, tático', 'cura em grupo e totens', 'H', 'PvE/PvP'],
            priest: ['Priest Holy/Discipline', 'versátil, estratégico', 'escudos, dispel e utilidade', 'H', 'PvE/PvP'],
            wfury: ['Warrior Fury', 'agressivo', 'dano alto e contínuo, simples', 'D', 'PvE/PvP'],
            warms: ['Warrior Arms', 'tático', 'burst com Mortal Strike e controle', 'D', 'PvP'],
            rassa: ['Rogue Assassination', 'preciso, oportunista', 'burst com venenos e energia', 'D', 'PvE/PvP'],
            rcombat: ['Rogue Combat', 'constante', 'pressão sustentada', 'D', 'PvE'],
            rsub: ['Rogue Subtlety', 'estrategista', 'stealth, controle e emboscadas', 'D', 'PvP'],
            dcat: ['Druid Feral (Cat)', 'dinâmico, técnico', 'burst, mobilidade e formas', 'D', 'PvP/PvE'],
            pret: ['Paladin Retribution', 'direto, resistente', 'pressão corpo a corpo e stuns', 'D', 'PvP'],
            senh: ['Shaman Enhancement', 'técnico, versátil', 'melee com totens e procs', 'D', 'PvE/PvP'],
            sele: ['Shaman Elemental', 'explosivo', 'dano mágico em rajadas', 'D', 'PvE/PvP'],
            mfire: ['Mage Fire', 'ousado', 'burst mágico e crits', 'D', 'PvE/PvP'],
            mfrost: ['Mage Frost', 'controlador', 'kite, congelamento e controle de campo', 'D', 'PvP'],
            ldestro: ['Warlock Destruction', 'agressivo', 'burst com Shadow Bolt e Conflagrate', 'D', 'PvE/PvP'],
            laffli: ['Warlock Affliction', 'paciente, metódico', 'DoTs, desgaste e fear', 'D', 'PvE/PvP'],
            ldemo: ['Warlock Demonology', 'estrategista', 'pets e utilidade', 'D', 'PvP/PvE'],
            pshadow: ['Priest Shadow', 'resiliente', 'DoTs, fear e sustain', 'D', 'PvE/PvP'],
            dbal: ['Druid Balance', 'criativo', 'dano mágico, DoTs e controle', 'D', 'PvE/PvP'],
            hbm: ['Hunter Beast Mastery', 'constante', 'pet forte e pressão contínua', 'D', 'PvE'],
            hmm: ['Hunter Marksmanship', 'preciso', 'burst à distância', 'D', 'PvE/PvP'],
            hsv: ['Hunter Survival', 'tático', 'armadilhas, controle e kite', 'D', 'PvP']
        };
        const ROLE = { T: 'Tank', H: 'Heal', D: 'DPS' };
        const ALL = k => g(Object.keys(S).join(' '), 1);

        const Q = [
            {
                q: 'Você prefere jogar de...', o: [
                    ['Tank: liderar a frente e proteger o time', { role: 'T' }],
                    ['Healer: manter todos vivos', { role: 'H' }],
                    ['DPS: causar dano e eliminar alvos', { role: 'D' }]]
            },

            // ---------- TANK (cada spec tem no máximo 3 pontos por pergunta)
            {
                r: 'T', q: 'Como você quer segurar o aggro?', o: [
                    ['Threat forte e previsível em um alvo só, como um boss', P('wprot', 'bear')],
                    ['Threat espalhado em vários alvos ao mesmo tempo', P('pprot', 'bear')],
                    ['Threat moderado, com sobrevivência acima de tudo', P('bear', 'wprot')]]
            },
            {
                r: 'T', q: 'Como você prefere reduzir o dano recebido?', o: [
                    ['Escudo, bloqueio e cooldowns usados na hora certa', P('wprot', 'pprot')],
                    ['Esquiva, muito HP e armadura reforçada', P('bear', 'wprot')],
                    ['Bolhas, auras e cura própria', P('pprot', 'bear')]]
            },
            {
                r: 'T', q: 'Qual recurso você prefere gerenciar?', o: [
                    ['Rage: gerar e gastar na hora certa', { w: { wprot: 2, bear: 2 } }],
                    ['Mana: administrar como um caster', { w: { pprot: 4 } }],
                    ['Rage e formas, com liberdade para trocar de função', { w: { bear: 3, wprot: 1 } }]]
            },
            {
                r: 'T', q: 'Que utilidade você quer levar ao grupo?', o: [
                    ['Buffs, auras e bênçãos', P('pprot', 'wprot')],
                    ['Controle de alvos: taunt, gritos e interrupções', P('wprot', 'bear')],
                    ['Ressurreição em combate, remoção de efeitos e versatilidade', P('bear', 'pprot')]]
            },
            {
                r: 'T', q: 'Fora do tank, o que você espera da sua classe?', o: [
                    ['Ser tank dedicado, 100% focado', P('wprot', 'pprot')],
                    ['Poder trocar para dano ou cura quando precisar', P('bear', 'pprot')],
                    ['Apoiar o grupo com cura e utilidade', P('pprot', 'bear')]]
            },
            {
                r: 'T', q: 'Em PvP, você prefere...', o: [
                    ['Controlar o alvo e aguentar pressão', P('wprot', 'pprot')],
                    ['Mobilidade e fuga', P('bear', 'wprot')],
                    ['Resistir com bolha e cura própria', P('pprot', 'bear')],
                    ['Não ligo para PvP', { w: { wprot: 1, bear: 1, pprot: 1 } }]]
            },

            // ---------- HEAL
            {
                r: 'H', q: 'Qual é o seu estilo de cura?', o: [
                    ['Curas diretas e potentes em um alvo', P('pholy', 'sresto')],
                    ['Curas ao longo do tempo, antecipando o dano', P('dresto', 'priest')],
                    ['Cura em grupo e cadeia de curas', P('sresto', 'pholy')],
                    ['Escudos, prevenção e versatilidade', P('priest', 'dresto')]]
            },
            {
                r: 'H', q: 'Qual situação de cura você mais quer dominar?', o: [
                    ['Curar o tank com precisão e poucos botões', P('pholy', 'priest')],
                    ['Curar muita gente ao mesmo tempo', P('sresto', 'priest')],
                    ['Prever o dano e deixar HoTs rodando', P('dresto', 'sresto')],
                    ['Reduzir o dano antes de ele acontecer', P('priest', 'pholy')]]
            },
            {
                r: 'H', q: 'Que nível de complexidade você curte?', o: [
                    ['Poucos botões, simples e eficiente', P('pholy', 'sresto')],
                    ['Muitos efeitos rodando ao mesmo tempo', P('dresto', 'priest')],
                    ['Gerenciar posição e totens', P('sresto', 'pholy')],
                    ['Gerenciar várias ferramentas de utilidade', P('priest', 'dresto')]]
            },
            {
                r: 'H', q: 'Que utilidade você quer levar ao grupo?', o: [
                    ['Bênçãos e auras poderosas', P('pholy', 'priest')],
                    ['Ressurreição em combate e recursos de mana para o time', P('dresto', 'sresto')],
                    ['Totens que ajudam todo o grupo', P('sresto', 'pholy')],
                    ['Dispel, buffs de vida e controle mental', P('priest', 'dresto')]]
            },
            {
                r: 'H', q: 'Como você prefere se posicionar na luta?', o: [
                    ['Na linha de frente, resistente, com armadura pesada', P('pholy', 'sresto')],
                    ['Em movimento constante, trocando de forma', P('dresto', 'sresto')],
                    ['Posicionando totens e ajustando o espaço', P('sresto', 'pholy')],
                    ['Protegido atrás do grupo, usando escudos', P('priest', 'dresto')]]
            },
            {
                r: 'H', q: 'Em PvP, você quer...', o: [
                    ['Sobreviver com bolha e auras', P('pholy', 'priest')],
                    ['Mobilidade e formas', P('dresto', 'sresto')],
                    ['Controle com totens e purge', P('sresto', 'pholy')],
                    ['Fear, escudos e dispel', P('priest', 'dresto')]]
            },

            // ---------- DPS (cada spec tem no máximo 3+3+2+2+2+2+2 pontos)
            {
                r: 'D', q: 'Qual é a sua distância preferida?', o: [
                    ['Corpo a corpo', { w: g('wfury warms rassa rcombat rsub dcat pret senh', 3) }],
                    ['À distância, com magia', { w: g('sele mfire mfrost ldestro laffli ldemo pshadow dbal', 3) }],
                    ['À distância, com arco ou arma', { w: g('hbm hmm hsv', 3) }]]
            },
            {
                r: 'D', q: 'O que mais te empolga?', o: [
                    ['Burst: explodir o alvo rapidamente', { w: g('wfury rassa dcat sele mfire ldestro hmm', 3) }],
                    ['Pressão contínua: desgastar o inimigo com o tempo', { w: g('pret rcombat senh pshadow laffli dbal hbm', 3) }],
                    ['Controle e mobilidade: kitar, atordoar e escapar', { w: g('warms rsub mfrost ldemo hsv dcat', 3) }]]
            },
            {
                r: 'D', q: 'Que nível de complexidade você curte?', o: [
                    ['Simples e consistente', { w: g('wfury pret rcombat sele pshadow hbm') }],
                    ['Média', { w: g('rassa warms senh mfire ldestro laffli hmm') }],
                    ['Alta, com muitas decisões e botões', { w: g('dcat rsub mfrost ldemo dbal hsv') }]]
            },
            {
                r: 'D', q: 'Você gosta de jogar com pet?', o: [
                    ['Sim, quero um pet ao meu lado', { w: g('ldemo laffli ldestro hbm hmm hsv') }],
                    ['Não, prefiro depender só de mim', { w: g('wfury warms rassa rcombat rsub dcat pret senh sele mfire mfrost pshadow dbal') }],
                    ['Tanto faz', { w: ALL() }]]
            },
            {
                r: 'D', q: 'Como você prefere sobreviver?', o: [
                    ['Evitando dano: stealth, blink, armadilhas ou formas', { w: g('rassa rsub dcat mfrost hsv') }],
                    ['Aguentando: armadura, cura e escudos', { w: g('wfury warms pret senh rcombat') }],
                    ['Derrubando o alvo antes que ele me alcance', { w: g('sele mfire ldestro hmm hbm') }],
                    ['Drenando vida e usando medo', { w: g('laffli ldemo pshadow dbal') }]]
            },
            {
                r: 'D', q: 'Qual é o seu foco principal?', o: [
                    ['PvE (raids e dungeons)', { w: g('wfury rcombat rassa hbm sele mfire ldestro laffli hmm') }],
                    ['PvP (arena, BG e mundo aberto)', { w: g('warms rsub dcat pret mfrost hsv pshadow senh ldemo dbal') }],
                    ['Os dois', { w: ALL() }]]
            },
            {
                r: 'D', q: 'Sob pressão, você tende a...', o: [
                    ['Assumir o controle da luta', { w: g('warms rsub mfrost laffli hsv ldemo dbal pshadow') }],
                    ['Manter a calma e reagir rápido', { w: g('dcat pret senh wfury rcombat rassa') }],
                    ['Executar com precisão e maximizar o resultado', { w: g('sele mfire ldestro hmm hbm') }]]
            }
        ];

        let ans = [], tb = [];
        const $ = id => document.getElementById(id);

        function calc() {
            const sc = {}, rp = { T: 0, H: 0, D: 0 };
            Object.keys(S).forEach(k => sc[k] = 0);
            ans.forEach(a => { const o = a.q.o[a.i][1]; if (o.role) rp[o.role] += 3; for (const k in (o.w || {})) sc[k] += o.w[k]; });
            tb.forEach(k => sc[k] += 1);
            const role = ans.length ? Object.keys(rp).sort((a, b) => rp[b] - rp[a])[0] : null;
            const list = role ? Object.keys(S).filter(k => S[k][3] === role) : [];
            const total = list.reduce((s, k) => s + sc[k] + 1, 0);
            const rank = list.map(k => ({ k, sc: sc[k], pct: (sc[k] + 1) / total * 100 })).sort((a, b) => b.sc - a.sc);
            const seq = role ? [Q[0]].concat(Q.filter(x => x.r === role)) : [Q[0]];
            return { role, rank, seq };
        }

        const C = { wprot: 'war', warms: 'war', wfury: 'war', bear: 'dru', dresto: 'dru', dcat: 'dru', dbal: 'dru', pprot: 'pal', pholy: 'pal', pret: 'pal', sresto: 'sha', senh: 'sha', sele: 'sha', priest: 'pri', pshadow: 'pri', rassa: 'rog', rcombat: 'rog', rsub: 'rog', mfire: 'mag', mfrost: 'mag', ldestro: 'loc', laffli: 'loc', ldemo: 'loc', hbm: 'hun', hmm: 'hun', hsv: 'hun' };
        const COL = { war: '#C79C6E', pal: '#F58CBA', hun: '#ABD473', rog: '#FFF569', pri: '#FFFFFF', sha: '#2B8CFF', mag: '#69CCF0', loc: '#9482C9', dru: '#FF7D0A' };
        const CN = { war: 'Warrior', pal: 'Paladin', hun: 'Hunter', rog: 'Rogue', pri: 'Priest', sha: 'Shaman', mag: 'Mage', loc: 'Warlock', dru: 'Druid' };
        const cc = k => COL[C[k]];
        const RC = { T: '#5aa0ff', H: '#5fd38a', D: '#ff6a4d' }, RI = ['🛡️', '💚', '⚔️'];
        const setAccent = k => document.documentElement.style.setProperty('--accent', k ? cc(k) : '#d9b25a');

        function render() {
            const c = calc(), m = $('main'), n = ans.length;
            setAccent();
            if (n < c.seq.length) {
                const q = c.seq[n], first = q === Q[0];
                m.innerHTML = '<div class="xp"><i style="width:' + (n / (c.role ? c.seq.length : 7) * 100) + '%"></i></div><div class="step">' + (c.role ? 'Pergunta ' + (n + 1) + ' de ' + c.seq.length + ' · ' + ROLE[c.role] : 'Pergunta 1') + '</div><h2>' + q.q + '</h2>' +
                    q.o.map((o, i) => '<button class="opt" data-i="' + i + '"' + (first ? ' style="--c:' + RC['THD'[i]] + '"><span class="ic">' + RI[i] + '</span>' : '>') + o[0] + '</button>').join('') +
                    (n || tb.length ? '<div class="actions"><button class="btn" id="back">Voltar</button></div>' : '');
                m.querySelectorAll('.opt').forEach(b => b.onclick = () => { ans.push({ q, i: +b.dataset.i }); render(); });
            } else {
                const top = c.rank[0].sc, tied = c.rank.filter(r => r.sc === top);
                if (tied.length > 1) {
                    const t = tied.slice(0, 4).sort(() => Math.random() - .5);
                    const dup = new Set(t.map(r => S[r.k][1])).size < t.length;
                    const tx = r => { const p = S[r.k][1]; return p[0].toUpperCase() + p.slice(1) + (dup ? ' · ' + S[r.k][2] : ''); };
                    m.innerHTML = '<div class="xp"><i style="width:100%"></i></div><div class="step">Desempate</div><p class="tie">Houve um empate no topo. Para desempatar, escolha a descrição que mais combina com você. O resultado continua em segredo até o final.</p><h2>Qual destas descrições é mais a sua cara?</h2>' +
                        t.map(r => '<button class="opt" data-k="' + r.k + '">' + tx(r) + '</button>').join('') +
                        '<div class="actions"><button class="btn" id="back">Voltar</button></div>';
                    m.querySelectorAll('.opt').forEach(b => b.onclick = () => { tb.push(b.dataset.k); render(); });
                } else result(c, m);
            }
            const bk = $('back'); if (bk) bk.onclick = () => { tb.length ? tb.pop() : ans.pop(); render(); };
        }

        function result(c, m) {
            const t3 = c.rank.slice(0, 3), k = t3[0].k, main = S[k];
            setAccent(k);
            const W = ans.map(a => ({ q: a.q.q, t: a.q.o[a.i][0], p: (a.q.o[a.i][1].w || {})[k] || 0 })).filter(x => x.p >= 2).sort((a, b) => b.p - a.p);
            const L = [];
            if (tb.includes(k)) L.push({ q: 'Desempate', x: 'Você escolheu a descrição “' + main[1] + '”, que é a cara do ' + main[0] + '.' });
            const F = [x => 'Você escolheu “' + x + '”: isso encaixa com o estilo do ' + main[0] + ' (' + main[2] + ').', x => 'Você preferiu “' + x + '”, e isso pesa a favor do ' + main[0] + '.', x => 'Sua resposta “' + x + '” também aponta para o ' + main[0] + '.'];
            W.forEach(w => { if (L.length < 3) L.push({ q: w.q, x: F[L.length](w.t) }); });
            if (L.length < 3) L.push({ q: 'Perfil geral', x: 'O conjunto das suas respostas desenhou um perfil ' + main[1] + ', que é o do ' + main[0] + '.' });
            m.innerHTML = '<div class="xp"><i style="width:100%"></i></div><div class="step">Missão cumprida</div>' +
                '<div class="item" style="--c:' + cc(k) + '"><div class="rar">Seu main</div><h2>' + main[0] + '</h2><div class="cl">' + CN[C[k]] + ' · ' + ROLE[c.role] + '</div><div class="pc">' + t3[0].pct.toFixed(1) + '% de compatibilidade</div></div>' +
                '<h3 class="mt cinz">Motivo</h3><ul class="why" style="--c:' + cc(k) + '">' + L.map(r => '<li><small>' + r.q + '</small>' + r.x + '</li>').join('') + '</ul>' +
                '<dl class="res"><dt>Role</dt><dd>' + ROLE[c.role] + '</dd>' +
                '<dt>Características principais</dt><dd>' + main[1] + '</dd>' +
                '<dt>Playstyle</dt><dd>' + main[2] + '</dd>' +
                '<dt>Forte em</dt><dd>' + main[4] + '</dd></dl>' +
                '<h3 class="cinz" style="margin-bottom:6px;color:var(--gold);font-size:17px">Top 3</h3><ul class="top3">' +
                t3.map(r => '<li style="--c:' + cc(r.k) + '"><span>' + S[r.k][0] + '</span><b>' + r.pct.toFixed(1) + '%</b></li>').join('') + '</ul>' +
                '<p class="note">O WoW Forever está em Beta e pode alterar talentos e viabilidade de specs. Confirme o Top 3 em jogo.</p>' +
                '<div class="actions"><button class="btn main" id="again">Refazer o questionário</button><button class="btn" id="back">Voltar</button></div>';
            $('again').onclick = () => { ans = []; tb = []; render(); };
        }
        render();
    </script>
</body>

</html>
