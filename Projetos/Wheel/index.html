<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de Classes - WoW Classic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Roleta de Classes</h1>
            <p>World of Warcraft</p>
        </header>

        <nav class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="tank">Tank</button>
            <button class="filter-btn" data-filter="healer">Healer</button>
            <button class="filter-btn" data-filter="melee-dps">Melee DPS</button>
            <button class="filter-btn" data-filter="ranged-dps">Ranged DPS</button>
            <button class="filter-btn skull-btn" id="skullModeBtn" title="Modo Eliminação (Hardcore)">💀</button>
        </nav>

        <main class="roulette-section">
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <div class="wheel-container" id="wheelContainer">
                    <svg id="wheelSvg" viewBox="0 0 500 500"></svg>
                </div>
                <div class="wheel-center-cap"></div>
            </div>

            <button id="spinBtn" class="spin-btn">Girar Roleta</button>
        </main>

        <div class="result-container" id="resultContainer">
            <span class="result-label" id="resultLabel">Sua classe é:</span>
            <span class="result-class" id="resultClass">-</span>
        </div>

        <!-- Painel para exibir as classes eliminadas no Modo Caveira -->
        <div class="eliminated-container hidden" id="eliminatedContainer">
            <span class="eliminated-title">Classes Eliminadas 💀</span>
            <div class="eliminated-list" id="eliminatedList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
