<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador de Classes - World of Warcraft TBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0d10;
      --card: #15181e;
      --text: #f0f3f8;
      --alliance: #0078ff;
      --horde: #b30000;
      --accent: #00ff98;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { 
      min-height: 100vh; 
      background-color: var(--bg); 
      color: var(--text); 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between;
      padding: 1.5rem 0 0 0;
    }
    
    h1 { 
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 2.5vh, 1.8rem); 
      font-weight: 700; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #a0a5b5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
    }

    .action-btn {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .action-btn.general {
      background: linear-gradient(135deg, #00ff98 0%, #00b36b 100%);
      color: #000;
      border: none;
      font-weight: 900;
    }

    .action-btn.alliance {
      border-color: rgba(0, 120, 255, 0.4);
      color: #66b3ff;
    }

    .action-btn.alliance:hover:not(:disabled) {
      background: rgba(0, 120, 255, 0.2);
      border-color: var(--alliance);
    }

    .action-btn.horde {
      border-color: rgba(179, 0, 0, 0.4);
      color: #ff6666;
    }

    .action-btn.horde:hover:not(:disabled) {
      background: rgba(179, 0, 0, 0.25);
      border-color: var(--horde);
    }

    .action-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* Container Centralizado */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
      margin: 1rem 0;
      padding: 0 1rem;
    }

    .wheels-container { 
      display: flex; 
      gap: 1.5rem; 
      justify-content: center; 
      align-items: center;
      width: 100%; 
    }

    .wheel-card { 
      background: var(--card); 
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; 
      padding: 1rem; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      flex: 1; 
      max-width: 360px;
      position: relative; 
    }
    
    .wheel-wrapper { 
      position: relative; 
      width: clamp(200px, 28vh, 260px); 
      height: clamp(200px, 28vh, 260px); 
      margin: 0.5rem 0 1rem 0; 
    }
    
    .pointer { 
      position: absolute; 
      top: -10px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 0; 
      height: 0; 
      border-left: 10px solid transparent; 
      border-right: 10px solid transparent; 
      border-top: 18px solid var(--text); 
      z-index: 10; 
    }
    
    canvas { 
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%; 
      transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1); 
    }

    .spin-btn { 
      background: transparent; 
      border: 2px solid var(--text); 
      color: var(--text); 
      padding: 0.5rem 1.4rem; 
      border-radius: 40px; 
      font-size: 0.8rem;
      font-weight: 800; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      letter-spacing: 2px; 
      text-transform: uppercase;
    }

    .spin-btn:hover:not(:disabled) { 
      background: var(--text); 
      color: var(--bg); 
      transform: translateY(-2px); 
    }

    .spin-btn:disabled { 
      opacity: 0.2; 
      cursor: not-allowed; 
      border-color: #444; 
    }

    .final-result-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.8rem 1.5rem;
      text-align: center;
      font-size: clamp(1rem, 2vh, 1.4rem);
      font-weight: 900;
      letter-spacing: 1px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
    }

    .placeholder { color: #555e6d; font-weight: 600; font-size: 0.95rem; }

    /* Footer Centralizado */
    footer {
      width: 100%;
      background-color: #0e1014;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #6c7584;
      text-align: center;
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .footer-link {
      color: #a0a5b5;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .footer-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>Sorteador de Classes - World of Warcraft TBC</h1>
    <div class="top-controls">
      <button class="action-btn general" id="btnGeneral" onclick="spinFaction('ALL')">Sorteio Geral</button>
      <button class="action-btn alliance" id="btnAlliance" onclick="spinFaction('Alliance')">Sorteio Aliança</button>
      <button class="action-btn horde" id="btnHorde" onclick="spinFaction('Horde')">Sorteio Horda</button>
    </div>
  </header>

  <main class="main-content">
    <div class="wheels-container">
      <div class="wheel-card">
        <div class="pointer"></div>
        <div class="wheel-wrapper">
          <canvas id="classWheel" width="280" height="280"></canvas>
        </div>
        <button class="spin-btn" id="btnClass" onclick="spinClass()">Girar Classe</button>
      </div>

      <div class="wheel-card">
        <div class="pointer"></div>
        <div class="wheel-wrapper">
          <canvas id="raceWheel" width="280" height="280"></canvas>
        </div>
        <button class="spin-btn" id="btnRace" onclick="spinRace()" disabled>Girar Raça</button>
      </div>
    </div>

    <div class="final-result-card" id="finalResult">
      <span class="placeholder">Escolha um tipo de sorteio acima</span>
    </div>
  </main>

    <footer>
        <div>
        © 2026 Desenvolvido por Victor F Prieto.
        </div>

        <a href="https://github.com/victorfprieto" target="_blank" rel="noopener noreferrer" class="footer-link">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
        </a>
    </footer>

  <script>
    const ALLIANCE_RACES = ["Human", "Dwarf", "Night Elf", "Gnome", "Draenei"];
    const HORDE_RACES = ["Orc", "Undead", "Tauren", "Troll", "Blood Elf"];

    const CLASSES = [
      { name: "Warrior", color: "#C79C6E", races: ["Human", "Dwarf", "Night Elf", "Gnome", "Draenei", "Orc", "Undead", "Tauren", "Troll"] },
      { name: "Paladin", color: "#F58CBA", races: ["Human", "Dwarf", "Draenei", "Blood Elf"] },
      { name: "Hunter", color: "#ABD473", races: ["Dwarf", "Night Elf", "Draenei", "Orc", "Tauren", "Troll", "Blood Elf"] },
      { name: "Rogue", color: "#FFF569", races: ["Human", "Dwarf", "Night Elf", "Gnome", "Orc", "Undead", "Troll", "Blood Elf"] },
      { name: "Priest", color: "#FFFFFF", races: ["Human", "Dwarf", "Night Elf", "Draenei", "Undead", "Troll", "Blood Elf"] },
      { name: "Shaman", color: "#0070DE", races: ["Draenei", "Orc", "Tauren", "Troll"] },
      { name: "Mage", color: "#69CCF0", races: ["Human", "Gnome", "Draenei", "Undead", "Troll", "Blood Elf"] },
      { name: "Warlock", color: "#9482C9", races: ["Human", "Gnome", "Orc", "Undead", "Blood Elf"] },
      { name: "Druid", color: "#FF7D0A", races: ["Night Elf", "Tauren"] }
    ];

    let selectedFaction = 'ALL';
    let availableClasses = [...CLASSES];
    let currentClass = null;
    let selectedRaceName = null;
    let classRotation = 0;
    let raceRotation = 0;

    function getRandomInt(max) {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return array[0] % max;
    }

    function getValidRacesForClass(classObj) {
      if (selectedFaction === 'Alliance') return classObj.races.filter(r => ALLIANCE_RACES.includes(r));
      if (selectedFaction === 'Horde') return classObj.races.filter(r => HORDE_RACES.includes(r));
      return classObj.races;
    }

    function applyFactionFilter(faction) {
      selectedFaction = faction;
      availableClasses = CLASSES.filter(c => getValidRacesForClass(c).length > 0);
      currentClass = null;
      selectedRaceName = null;
      document.getElementById('btnRace').disabled = true;
      updateResultUI();

      drawWheel('classWheel', availableClasses, item => item.color);
      drawWheel('raceWheel', ["Aguardando..."], () => "#222630");
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('btnClass').disabled = disabled;
      document.getElementById('btnRace').disabled = disabled || !currentClass;
      document.getElementById('btnGeneral').disabled = disabled;
      document.getElementById('btnAlliance').disabled = disabled;
      document.getElementById('btnHorde').disabled = disabled;
    }

    function drawWheel(canvasId, items, getColorFn) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const numSlices = items.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      items.forEach((item, i) => {
        const angle = i * sliceAngle - Math.PI / 2;
        ctx.beginPath();
        ctx.fillStyle = getColorFn(item, i);
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = (getColorFn(item, i) === "#FFFFFF" || getColorFn(item, i) === "#FFF569") ? "#000000" : "#FFFFFF";
        ctx.font = "900 13px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText(item.name || item, radius - 16, 4);
        ctx.restore();
      });
    }

    function updateResultUI() {
      const display = document.getElementById('finalResult');
      
      if (currentClass && selectedRaceName) {
        display.innerHTML = `🏆 <span style="color: ${currentClass.color}">${currentClass.name}</span> - <span style="color: ${currentClass.color}">${selectedRaceName}</span> 🏆`;
      } else if (currentClass) {
        display.innerHTML = `🏆 <span style="color: ${currentClass.color}">${currentClass.name}</span> - <span class="placeholder">Gire a Raça...</span> 🏆`;
      } else {
        display.innerHTML = `<span class="placeholder">Escolha um tipo de sorteio acima</span>`;
      }
    }

    function spinClass(onComplete) {
      const classCanvas = document.getElementById('classWheel');
      setButtonsDisabled(true);
      selectedRaceName = null;

      const selectedIndex = getRandomInt(availableClasses.length);
      currentClass = availableClasses[selectedIndex];

      const sliceAngle = 360 / availableClasses.length;
      const extraDegrees = 360 - (selectedIndex * sliceAngle) - (sliceAngle / 2);
      const extraSpins = (4 + getRandomInt(3)) * 360;
      classRotation += extraSpins + extraDegrees - (classRotation % 360);
      
      classCanvas.style.transform = `rotate(${classRotation}deg)`;

      setTimeout(() => {
        updateResultUI();
        const races = getValidRacesForClass(currentClass);
        drawWheel('raceWheel', races, (_, i) => i % 2 === 0 ? "#2a2f3d" : "#1d212b");
        setButtonsDisabled(false);
        if (onComplete) onComplete();
      }, 4000);
    }

    function spinRace() {
      const raceCanvas = document.getElementById('raceWheel');
      setButtonsDisabled(true);

      const races = getValidRacesForClass(currentClass);
      const selectedIndex = getRandomInt(races.length);
      selectedRaceName = races[selectedIndex];

      const sliceAngle = 360 / races.length;
      const extraDegrees = 360 - (selectedIndex * sliceAngle) - (sliceAngle / 2);
      const extraSpins = (4 + getRandomInt(3)) * 360;
      raceRotation += extraSpins + extraDegrees - (raceRotation % 360);

      raceCanvas.style.transform = `rotate(${raceRotation}deg)`;

      setTimeout(() => {
        updateResultUI();
        setButtonsDisabled(false);
      }, 4000);
    }

    function spinFaction(faction) {
      applyFactionFilter(faction);
      spinClass(() => {
        setTimeout(spinRace, 500);
      });
    }

    applyFactionFilter('ALL');
  </script>
</body>
</html>
